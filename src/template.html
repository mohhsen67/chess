<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="darkreader-lock">
<meta name="theme-color" content="#0F1827">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="شطرنج">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>شطرنج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Symbols+2&display=swap">
<style>
:root{
  /* Shatranj: one dark world. Navy ground, lavender accent, tinted cards, slate-blue board. Layout: sticky top bar, summary before detail, cards only where they group. */
  --bg:#0F1827;
  --surface:#152136;
  --raise:#1C2A42;
  --line:#26344F;
  --text:#E8ECF5;
  --muted:#93A0B8;
  --accent:#B9A6FF;
  --accent-ink:#1B1438;
  --tint:#1A2042;
  --tint-line:#363E78;
  --win:#4CD4A8;
  --loss:#F05A6E;
  --draw:#93A0B8;
  --sq-light:#CBD3E4;
  --sq-dark:#5F6F92;
  --hl-light:#D9CCFF;
  --hl-dark:#8E7BD6;
  --font-body:"Vazirmatn",Tahoma,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --font-piece:"Noto Sans Symbols 2","Segoe UI Symbol","DejaVu Sans",serif;
  --r:22px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
/* iPhone home-screen app draws under the status bar but reports a viewport that is shorter by the same amount */
html,body{height:calc(100% + env(safe-area-inset-top))}
a{color:var(--accent)}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.35}
p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell: header, one screen of content, nav */
.top{flex:none;background:var(--surface);border-bottom:1px solid var(--line);z-index:20}
.top{padding-top:env(safe-area-inset-top)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand svg{width:30px;height:30px}
.brand b{font-size:21px;font-weight:800}
.nav{display:flex;gap:4px;margin-inline-start:12px}
.bottomnav{display:none}
.nav a{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:12px;color:var(--muted);text-decoration:none;font-size:15px;font-weight:500}
.nav a:hover,.nav a[aria-current="page"]{color:var(--text);background:var(--raise)}
.nav a svg{width:18px;height:18px}
body.noreport .nav a[data-view="games"],body.noreport .nav a[data-view="train"]{opacity:.45;pointer-events:none}
body.signedout .nav{display:none}

main{flex:1;min-height:0;width:100%;max-width:1180px;margin:0 auto;padding:20px;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.vh{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
.vh h1{font-size:24px;font-weight:800}
.uchip{display:inline-flex;align-items:center;gap:6px;min-height:36px;max-width:62%;padding:0 12px;border-radius:999px;background:var(--raise);border:1px solid var(--line);color:var(--muted);font-size:13px;text-decoration:none;white-space:nowrap;overflow:hidden}
.uchip .mono{color:var(--text);overflow:hidden;text-overflow:ellipsis}
.uchip svg{flex:none;width:15px;height:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
.fine{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--raise);color:var(--text);font-weight:500;font-size:15px;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:#34456A;background:#22324D}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#CBBDFF}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:500;font-size:14px;cursor:pointer;min-height:44px;padding:0 4px;flex:none}
.iconbtn{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--raise);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.track{height:6px;border-radius:3px;background:var(--raise);overflow:hidden}
.fill{height:100%;border-radius:3px;background:var(--accent)}

/* report: swipeable cards */
.pager{flex:1;min-height:0;display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.pcard{flex:0 0 100%;scroll-snap-align:start;min-height:0;display:flex;flex-direction:column;gap:14px;overflow-y:auto;scrollbar-width:none}
.pcard::-webkit-scrollbar{display:none}
.pcard h2{font-size:17px;font-weight:600}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ph p{font-size:12px;color:var(--muted)}
.dots{flex:none;display:flex;justify-content:center;gap:2px}
.dots button{width:26px;height:26px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dots button i{width:7px;height:7px;border-radius:4px;background:#34456A;transition:width .2s,background .2s}
.dots button[aria-current="true"] i{width:20px;background:var(--accent)}
.weak-main{background:var(--tint);border-color:var(--tint-line)}
.weak-main .eyebrow{color:var(--accent)}
.weak-main h1{font-size:clamp(26px,7vw,36px);font-weight:800;color:var(--accent);letter-spacing:-.015em}
.weak-main .detail{font-size:16px;color:#C4CCDC}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .track{height:8px;border-radius:4px}
.meter span{font-size:12px;color:var(--muted)}
.tip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(185,166,255,.08);font-size:14px}
.tip svg{flex:none;width:20px;height:20px;color:var(--accent);margin-top:2px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.stack .btn{width:100%}
.wm-head{display:flex;align-items:center;gap:12px}
.wm-head h2{font-size:17px;font-weight:600}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
.ring{display:flex;flex-direction:column;align-items:center;gap:8px}
.ring .rv{position:relative;width:100%;max-width:124px;aspect-ratio:1}
.ring svg{width:100%;height:100%;display:block}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3}
.ring .in small{font-size:11px;color:var(--muted)}
.ring .in b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.ring .cap{font-size:12px;color:var(--muted)}
.kv{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.kv div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv div span:first-child{color:var(--muted)}
.prow{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:start;cursor:pointer}
.prow:last-child{border-bottom:0}
.prow .pt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.prow h3{font-size:15px;font-weight:600}
.prow p{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pbar{display:flex;align-items:center;gap:10px}
.pbar .track{flex:1}
.pbar .fill{background:#C4CCDC}
.pbar span{font-size:12px;color:var(--muted);white-space:nowrap}
.orow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.orow:last-child{border-bottom:0}
.on{flex:1;min-width:0}
.on b{display:block;font-weight:500;font-size:14px;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.on small{font-size:12px;color:var(--muted)}
.os{flex:none;width:84px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px}
.os .track{width:84px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-mono);font-size:11px;fill:var(--muted)}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.phase{background:var(--raise);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.phase b{font-size:20px;font-weight:600}
.phase span{font-size:11px;color:var(--muted)}

/* tiles */
.tile{flex:none;width:48px;height:48px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center}
.tile svg{width:24px;height:24px}
.tile.sm{width:42px;height:42px;border-radius:13px}
.tile.sm svg{width:21px;height:21px}
.t-purple{background:#2A2452;color:#B9A6FF}
.t-amber{background:#3A2D18;color:#F2B64C}
.t-blue{background:#172A4C;color:#6EA8FF}
.t-teal{background:#113A36;color:#4CD4A8}
.t-red{background:#3B1D2A;color:#F05A6E}
.t-gray{background:#222E45;color:#93A0B8}

/* board */
.bwrap{flex:1;min-height:160px;container-type:size;display:flex;align-items:center;justify-content:center}
.bwrap .board{width:min(100cqw,100cqh)}
.board{container-type:inline-size;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border-radius:0;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 20px 50px -20px rgba(0,0,0,.6);direction:ltr;user-select:none;-webkit-user-select:none}
.sq{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:0;padding:0;margin:0;font-family:var(--font-piece);font-size:9.4cqi;line-height:1;background:var(--sq-light);color:inherit}
.sq.d{background:var(--sq-dark)}
.sq.hl{box-shadow:inset 0 0 0 999px rgba(255,208,80,.45)}
.sq.bad{box-shadow:inset 0 0 0 999px rgba(235,80,95,.5)}
.sq.sel{box-shadow:inset 0 0 0 999px rgba(120,190,255,.45)}
button.sq{cursor:pointer}
.sq.tgt::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(20,26,40,.28)}
.sq.tgt.cap::after{width:88%;height:88%;background:transparent;box-shadow:inset 0 0 0 4px rgba(20,26,40,.28)}
.pc{position:relative;z-index:1;width:100%;height:100%;background-size:100% 100%;background-repeat:no-repeat}
/*PIECES*/
.coord{position:absolute;font-family:var(--font-mono);font-size:2.4cqi;font-weight:700;color:var(--sq-dark)}
.sq.d .coord{color:var(--sq-light)}
.coord.f{bottom:2%;right:5%}
.coord.r{top:3%;left:5%}

/* games */
.gwrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:24px}
.glistp{min-height:0;display:flex;flex-direction:column;gap:12px}
.filters{flex:none;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.glist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.gitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:start;padding:12px 14px;border-radius:18px;border:1px solid transparent;background:var(--surface);cursor:pointer;flex:none}
.gitem:hover{border-color:var(--line)}
.gitem[aria-current="true"]{border-color:var(--accent)}
.who{display:flex;flex-direction:column;min-width:0}
.who b{font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--muted)}
.gres{font-weight:600;font-size:13px}
.gres.W{color:var(--win)}.gres.L{color:var(--loss)}.gres.D{color:var(--draw)}
.flag{color:var(--loss)}
.pill{display:inline-flex;align-items:center;justify-content:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;flex:none}
.pill.W{background:rgba(76,212,168,.14);color:var(--win)}
.pill.L{background:rgba(240,90,110,.14);color:var(--loss)}
.pill.D{background:rgba(147,160,184,.14);color:var(--draw)}
.gview{min-height:0;display:flex;flex-direction:column;gap:12px}
.vtop{flex:none;display:flex;align-items:center;gap:10px}
.vt{min-width:0;display:flex;flex-direction:column}
.vt b{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.vt b bdi{overflow:hidden;text-overflow:ellipsis}
.vt small{font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.back{display:none}
.ctrls{flex:none;display:flex;gap:8px;direction:ltr;justify-content:center}
.ctrls{gap:2px}
.ctrls button{flex:1;max-width:72px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.ctrls button:hover{background:var(--raise);color:var(--text)}
.ctrls button:active{background:var(--raise)}
.ctrls svg{width:22px;height:22px}
.mstrip{flex:none;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;direction:ltr;font-family:var(--font-mono);font-size:13px}
.mstrip::-webkit-scrollbar{display:none}
.mstrip button{flex:none;min-height:36px;padding:0 10px;border-radius:10px;border:0;background:var(--raise);color:var(--text);font:inherit;cursor:pointer;white-space:nowrap}
.mstrip button small{color:var(--muted);margin-right:4px}
.mstrip button.blun{color:var(--loss);font-weight:600}
.mstrip button.cur{background:var(--accent);color:var(--accent-ink)}
.mstrip button.cur small{color:var(--accent-ink)}
.note{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:8px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.note b{font-weight:600}
.note.bad{border-color:rgba(240,90,110,.45)}
.note.bad b{color:var(--loss)}
.matc{flex:none}

/* train */
.tview{max-width:620px;width:100%;margin:0 auto}
.tprog{flex:none;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.tprog .track{flex:1}
.tq{flex:none;font-size:15px;color:#C4CCDC;line-height:1.7}
.fb{flex:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.fb svg{flex:none;width:22px;height:22px}
.fb.ok{border-color:rgba(76,212,168,.5)}
.fb.ok svg{color:var(--win)}
.fb.no{border-color:rgba(240,90,110,.5)}
.fb.no svg{color:var(--loss)}
.tact{flex:none;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.tact .btn{padding:0 8px;font-size:14px}

/* account + club */
.form{display:flex;flex-direction:column;gap:12px}
.form h2{font-size:16px;font-weight:600}
.sep{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 10px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--tint-line)}
.codebox .mono{font-size:20px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:#C4CCDC}
.blist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:6px 18px}
.brow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow.me .who b{color:var(--accent)}
.rank{font-weight:800;font-size:16px;color:var(--muted);text-align:center}
.brow .meta b{font-size:16px;color:var(--text)}
button.uchip{cursor:pointer;font:inherit;font-size:13px}

/* eval bar + analysis */
.tline{flex:none;display:flex;gap:8px;align-items:baseline;font-size:13px;overflow:hidden;white-space:nowrap;direction:ltr;justify-content:flex-end}
.tline .pv{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.vline{flex:none;font-size:13px;color:var(--muted);overflow-x:auto;white-space:nowrap;scrollbar-width:none;text-align:right}
.vline .cur{color:var(--accent);font-weight:600}
.fb{max-height:32%;overflow-y:auto}
.fbt{display:flex;flex-direction:column;gap:4px;min-width:0}
.why{font-size:13px;color:#C4CCDC;line-height:1.65}
.tview .fb{padding:8px 12px}
.why .pv{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.hfill{transition:none}}

/* eval graph + horizontal bar */
.gchartw{position:relative;flex:none;height:56px}
.gchartw svg{display:block;width:100%;height:100%}
.glab{position:absolute;top:4px;left:6px;font-size:11px;font-weight:700;color:#262D40;background:rgba(236,233,244,.85);padding:0 5px;line-height:18px}
.gbusy{position:absolute;bottom:3px;right:6px;font-size:10px;color:#C4CCDC}
.hbar{flex:none;display:flex;align-items:center;gap:8px}
.htrack{position:relative;flex:1;height:10px;background:#262D40;overflow:hidden}
.hfill{position:absolute;top:0;bottom:0;left:0;background:#ECE9F4;transition:width .35s ease}
.hmid{position:absolute;top:0;bottom:0;left:50%;width:1px;background:#8F97AA}
.hbar b{font-size:12px;min-width:38px;text-align:right}
.pswatch{width:38px;height:38px;padding:3px;border:2px solid transparent;border-radius:9px;background:#EBECD0;cursor:pointer}
.pswatch img{width:100%;height:100%;display:block}
.pswatch[aria-pressed="true"]{border-color:var(--accent)}
.kv .swatches{flex-wrap:wrap;justify-content:flex-end}

/* board color picker */
.swatches{display:flex;gap:8px}
.kv .swatches{border:0;padding:0}
.swatch{width:34px;height:34px;padding:0;border:2px solid transparent;border-radius:9px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;cursor:pointer;background:none}
.swatch i{display:block}
.swatch[aria-pressed="true"]{border-color:var(--accent)}
.kv div{align-items:center}

/* compact bits */
.brand-big{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 4px}
.brand-big img{border-radius:18px;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.brand-big b{font-size:24px;font-weight:800}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2.push{margin-top:auto}
.inrow{display:flex;gap:8px}
.inrow .field{flex:1;min-width:0}
.inrow .btn{flex:none}
.linkbtn.inline{min-height:0;padding:0;font-size:12px}
.pcard.center{justify-content:center}

/* import + welcome */
.seg{flex:none;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--raise)}
.seg button{min-height:40px;border:0;border-radius:11px;background:none;color:var(--muted);font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text)}
.icard{flex:0 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;max-width:620px;width:100%;margin:0 auto}
.iwrap{max-width:620px;width:100%;margin:0 auto}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:48px;font-size:16px}
.field input[dir="ltr"]:placeholder-shown{direction:rtl}
.field textarea{min-height:84px;font-family:var(--font-mono);font-size:12px;direction:ltr;resize:none}
.dl{display:flex;flex-direction:column;gap:4px}
.dl a{font-size:14px}
.drop{border:1.5px dashed #34456A;border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;cursor:pointer;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:rgba(185,166,255,.08)}
.drop svg{flex:none;width:26px;height:26px;color:var(--accent)}
.err{color:var(--loss);font-size:14px}
.welcome{flex:1;min-height:0;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:16px}
.wcard{display:flex;flex-direction:column;gap:16px;padding:26px;background:var(--tint);border-color:var(--tint-line);overflow-y:auto;min-height:0}
.wcard h1{font-size:clamp(24px,6.5vw,32px);font-weight:800;letter-spacing:-.015em}
.wcard .lead{color:#C4CCDC;font-size:15px}
.feat{display:flex;flex-direction:column;padding:0 4px}
.frow{display:flex;gap:14px;align-items:center;padding:8px 0}
.frow div{display:flex;flex-direction:column;line-height:1.5}
.frow b{font-weight:600;font-size:15px}
.frow span{font-size:13px;color:var(--muted)}

@media (max-width:980px){
  .gwrap{display:flex;flex-direction:column}
  .gview{display:none}
  .gwrap.open .glistp{display:none}
  .gwrap.open .gview{display:flex;flex:1}
  .back{display:flex}
}
@media (min-width:760px){.pcard{flex-basis:calc((100% - 14px)/2)}}
@media (min-width:1100px){.pcard{flex-basis:calc((100% - 28px)/3)}}
@media (max-width:720px){
  .top{display:none}
  .bottomnav{display:flex;flex:none;margin:0;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom))}
  .nav a{flex-direction:column;gap:0;font-size:11px;min-height:52px;padding:4px 6px;flex:1;justify-content:center}
  .nav a[aria-current="page"]{background:transparent;color:var(--accent)}
  .nav a svg{width:22px;height:22px}
  main{padding:calc(14px + env(safe-area-inset-top)) 16px 12px}
  .vh h1{font-size:22px}
  .card{padding:18px}
}
@media (max-height:780px){.feat{display:none}}
@media (max-height:720px){
  .matc{display:none}
  .view{gap:10px}
  .weak-main .detail{font-size:15px}
  .ring .rv{max-width:104px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

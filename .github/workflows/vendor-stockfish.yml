name: Vendor Stockfish

# Copies a single-threaded Stockfish build (JS + WASM) from npm into vendor/stockfish,
# so the site serves the engine itself. Runs when this file changes, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/vendor-stockfish.yml']

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch package
        run: |
          set -e
          cd /tmp
          npm pack stockfish@17
          tar xzf stockfish-*.tgz
          find package -type f | sort > /tmp/files.txt
          mkdir -p "$GITHUB_WORKSPACE/vendor/stockfish"
          cp /tmp/files.txt "$GITHUB_WORKSPACE/vendor/stockfish/FILES.txt"
          for f in $(grep -E 'lite-single.*\.(js|wasm)$' /tmp/files.txt); do cp "$f" "$GITHUB_WORKSPACE/vendor/stockfish/"; done
          for f in package/Copying.txt package/COPYING package/LICENSE package/README.md; do [ -f "$f" ] && cp "$f" "$GITHUB_WORKSPACE/vendor/stockfish/" || true; done
          ls -la "$GITHUB_WORKSPACE/vendor/stockfish"
      - name: Commit
        run: |
          git config user.name "shatranj-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Vendor Stockfish build from npm"
          git push

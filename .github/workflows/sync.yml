name: Sync games from Chess.com

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/players.txt', '.github/scripts/sync.mjs']

permissions:
  contents: write

concurrency:
  group: sync-games
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/sync.mjs
      - name: Commit new games
        run: |
          git config user.name "shatranj-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No new games"; exit 0; fi
          git commit -m "Sync games from Chess.com"
          git push

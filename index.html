<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شطرنج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;800&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Symbols+2&display=swap">
<style>
:root{
  /* Shatranj: one dark world. Navy ground, lavender accent, tinted cards, slate-blue board. Layout: sticky top bar, summary before detail, cards only where they group. */
  --bg:#0F1827;
  --surface:#152136;
  --raise:#1C2A42;
  --line:#26344F;
  --text:#E8ECF5;
  --muted:#93A0B8;
  --accent:#B9A6FF;
  --accent-ink:#1B1438;
  --tint:#1A2042;
  --tint-line:#363E78;
  --win:#4CD4A8;
  --loss:#F05A6E;
  --draw:#93A0B8;
  --sq-light:#CBD3E4;
  --sq-dark:#5F6F92;
  --hl-light:#D9CCFF;
  --hl-dark:#8E7BD6;
  --font-body:"Vazirmatn",Tahoma,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --font-piece:"Noto Sans Symbols 2","Segoe UI Symbol","DejaVu Sans",serif;
  --r:22px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.35}
p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand svg{width:30px;height:30px}
.brand b{font-size:22px;font-weight:800;letter-spacing:-.01em}
.nav{display:flex;gap:4px;margin-inline-start:12px}
.nav a{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:15px;font-weight:500}
.nav a:hover{color:var(--text);background:var(--raise)}
.nav a[aria-current="page"]{color:var(--text);background:var(--raise)}
.nav a svg{width:18px;height:18px}
.top .spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--raise);color:var(--text);font-weight:500;font-size:15px;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:#34456A;background:#22324D}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#CBBDFF}
.btn.ghost{background:transparent}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.45;cursor:default}

main{max-width:1180px;margin:0 auto;padding:28px 20px 120px;display:flex;flex-direction:column;gap:28px}
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border:1px dashed #34456A;border-radius:12px;color:var(--muted);font-size:14px}
.banner b{color:var(--text);font-weight:600}
.banner .btn{min-height:36px;padding:0 14px;font-size:14px;margin-inline-start:auto}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:18px;font-weight:600}
.sec-h p{font-size:13px;color:var(--muted)}

/* report */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.weak-main{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:30px;background:var(--tint);border-color:var(--tint-line)}
.weak-main h1{color:var(--accent)}
.weak-main .tip{background:rgba(185,166,255,.08)}
.weak-main .eyebrow{color:var(--accent)}
.weak-main h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.015em}
.weak-main .detail{font-size:17px;color:#C4CCDC;max-width:56ch}
.meter{display:flex;flex-direction:column;gap:8px;max-width:440px}
.meter .track{height:8px;border-radius:4px;background:var(--raise);overflow:hidden}
.meter .fill{height:100%;background:var(--accent);border-radius:4px}
.meter span{font-size:13px;color:var(--muted)}
.tip{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:var(--raise);font-size:15px;max-width:60ch}
.tip svg{flex:none;width:20px;height:20px;color:var(--accent);margin-top:3px}
.actions{display:flex;gap:10px;flex-wrap:wrap}

.summary{display:flex;flex-direction:column;gap:18px}
.bigscore{display:flex;align-items:baseline;gap:10px}
.bigscore b{font-size:52px;font-weight:800;line-height:1;letter-spacing:-.02em}
.bigscore span{color:var(--muted);font-size:14px}
.wdl{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.wdl i{display:block;height:100%}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.kv{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.kv div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv div span:first-child{color:var(--muted)}

.wlist{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:auto minmax(0,1fr) 180px auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.wrow:first-child{padding-top:4px}
.wrow h3{font-size:16px;font-weight:600}
.wrow p{font-size:14px;color:var(--muted)}
.sev{display:flex;flex-direction:column;gap:6px}
.sev .track{height:6px;border-radius:3px;background:var(--raise);overflow:hidden}
.sev .fill{height:100%;background:#C4CCDC;border-radius:3px}
.sev span{font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:500;font-size:14px;cursor:pointer;min-height:44px;padding:0 4px}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--muted);text-align:start;padding:0 0 10px;font-size:13px}
td{padding:11px 0;border-top:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:end;padding-inline-start:12px;white-space:nowrap}
.op-name{display:flex;flex-direction:column}
.op-name small{color:var(--muted);font-size:12px}
.scorebar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.scorebar .track{width:70px;height:6px;border-radius:3px;background:var(--raise);overflow:hidden}
.scorebar .fill{height:100%;border-radius:3px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-mono);font-size:11px;fill:var(--muted)}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.phase{background:var(--raise);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.phase b{font-size:22px;font-weight:600}
.phase span{font-size:12px;color:var(--muted)}

/* board */
.board{container-type:inline-size;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 20px 50px -20px rgba(0,0,0,.6);direction:ltr;user-select:none;-webkit-user-select:none}
.sq{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:0;padding:0;margin:0;font-family:var(--font-piece);font-size:9.4cqi;line-height:1;background:var(--sq-light);color:inherit}
.sq.d{background:var(--sq-dark)}
.sq.hl{background:var(--hl-light)}
.sq.d.hl{background:var(--hl-dark)}
.sq.bad{background:#F2A3AD}
.sq.d.bad{background:#C0606E}
.sq.sel{box-shadow:inset 0 0 0 3px var(--accent)}
button.sq{cursor:pointer}
.sq.tgt::after{content:"";position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(15,24,39,.35)}
.sq.tgt.cap::after{width:84%;height:84%;background:transparent;box-shadow:inset 0 0 0 4px rgba(15,24,39,.35)}
.pw{color:#F7F4EE;text-shadow:1px 0 #141B2B,-1px 0 #141B2B,0 1px #141B2B,0 -1px #141B2B,0 2px 4px rgba(0,0,0,.35)}
.pb{color:#141B2B;text-shadow:0 0 1px rgba(255,255,255,.3),0 2px 4px rgba(0,0,0,.3)}
.coord{position:absolute;font-family:var(--font-mono);font-size:2.4cqi;font-weight:600;opacity:.75;color:#1F2A40}
.sq.d .coord{color:#E3E6EA}
.coord.f{bottom:2%;right:5%}
.coord.r{top:3%;left:5%}

/* games */
.gwrap{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:start}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.glist{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 230px);overflow:auto;padding-inline-end:4px}
.gitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:start;padding:14px 16px;border-radius:18px;border:1px solid transparent;background:var(--surface);cursor:pointer}
.gitem:hover{border-color:var(--line)}
.gitem[aria-current="true"]{border-color:var(--accent)}
.gitem .who{display:flex;flex-direction:column;min-width:0}
.gitem .who b{font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gitem .who small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gitem .meta{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600}
.pill.W{background:rgba(76,212,168,.14);color:var(--win)}
.pill.L{background:rgba(240,90,110,.14);color:var(--loss)}
.pill.D{background:rgba(147,160,184,.14);color:var(--draw)}
.flag{color:var(--loss)}
.viewer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:20px;align-items:start}
.vhead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vhead h2{font-size:22px;font-weight:600}
.vhead p{color:var(--muted);font-size:14px}
.vboard{display:flex;flex-direction:column;gap:12px}
.ctrls{display:flex;gap:8px;direction:ltr;justify-content:center}
.ctrls button{width:52px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--raise);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center}
.ctrls button:hover{border-color:#34456A}
.ctrls svg{width:18px;height:18px}
.side{display:flex;flex-direction:column;gap:14px}
.moves{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-height:360px;overflow:auto;direction:ltr;font-family:var(--font-mono);font-size:13px}
.mrow{display:grid;grid-template-columns:40px 1fr 1fr;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow span{padding:7px 10px;color:var(--muted)}
.mrow button{text-align:left;padding:7px 10px;background:none;border:0;cursor:pointer;color:var(--text);font-family:inherit;font-size:inherit}
.mrow button:hover{background:var(--raise)}
.mrow button.cur{background:var(--accent);color:var(--accent-ink)}
.mrow button.blun{color:var(--loss);font-weight:600}
.mrow button.cur.blun{color:var(--accent-ink)}
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.note b{font-weight:600}
.note.bad{border-color:rgba(240,90,110,.45)}
.note.bad b{color:var(--loss)}
.matlabel{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}

/* train */
.twrap{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:32px;align-items:start}
.tpanel{display:flex;flex-direction:column;gap:18px}
.tpanel h1{font-size:28px;font-weight:800}
.tprog{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.tprog .track{flex:1;height:6px;border-radius:3px;background:var(--raise);overflow:hidden}
.tprog .fill{height:100%;background:var(--accent)}
.fb{padding:16px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px;min-height:60px;display:flex;align-items:center;gap:12px}
.fb svg{flex:none;width:22px;height:22px}
.fb.ok{border-color:rgba(76,212,168,.5)}
.fb.ok svg{color:var(--win)}
.fb.no{border-color:rgba(240,90,110,.5)}
.fb.no svg{color:var(--loss)}
.fine{font-size:12px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* import */
.import{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.import h2{font-size:20px;font-weight:600;margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px}
.field textarea{min-height:120px;font-family:var(--font-mono);font-size:12px;direction:ltr;resize:vertical}
.steps{display:flex;flex-direction:column;gap:12px;margin:14px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:12px;font-size:14px;color:#C4CCDC}
.steps li::before{counter-increment:s;content:counter(s,persian);flex:none;width:26px;height:26px;border-radius:50%;background:var(--raise);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--accent);font-weight:600}
.dl{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.dl a{font-size:14px;word-break:break-all}
.drop{border:1.5px dashed #34456A;border-radius:14px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted);font-size:14px;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:rgba(185,166,255,.08)}
.drop svg{width:28px;height:28px;color:var(--accent)}
.err{color:var(--loss);font-size:14px}
.ok-msg{color:var(--win);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}


/* rings + tiles (match the user's app) */
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center}
.ring{display:flex;flex-direction:column;align-items:center;gap:10px}
.ring .rv{position:relative;width:100%;max-width:124px;aspect-ratio:1}
.ring svg{width:100%;height:100%;display:block}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3}
.ring .in small{font-size:11px;color:var(--muted)}
.ring .in b{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.ring .cap{font-size:12px;color:var(--muted)}
.tile{flex:none;width:48px;height:48px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center}
.tile svg{width:24px;height:24px}
.tile.sm{width:42px;height:42px;border-radius:13px}
.tile.sm svg{width:21px;height:21px}
.t-purple{background:#2A2452;color:#B9A6FF}
.t-amber{background:#3A2D18;color:#F2B64C}
.t-blue{background:#172A4C;color:#6EA8FF}
.t-teal{background:#113A36;color:#4CD4A8}
.t-red{background:#3B1D2A;color:#F05A6E}
.t-gray{background:#222E45;color:#93A0B8}
.wm-head{display:flex;align-items:center;gap:12px}
.gres{font-weight:600;font-size:13px}
.gres.W{color:var(--win)}.gres.L{color:var(--loss)}.gres.D{color:var(--draw)}

@media (max-width:980px){
  .hero,.grid2,.import{grid-template-columns:minmax(0,1fr)}
  .gwrap{grid-template-columns:minmax(0,1fr)}
  .glist{max-height:none}
  .viewer{grid-template-columns:minmax(0,1fr)}
  .twrap{grid-template-columns:minmax(0,1fr);gap:22px}
}
@media (max-width:720px){
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .top-in{padding:10px 16px}
  .nav{position:fixed;bottom:0;left:0;right:0;margin:0;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:30}
  .nav a{flex-direction:column;gap:2px;font-size:11px;min-height:52px;padding:6px 10px;flex:1;justify-content:center}
  .nav a[aria-current="page"]{background:transparent;color:var(--accent)}
  .nav a svg{width:22px;height:22px}
  main{padding:20px 16px 110px;gap:22px}
  .card{padding:18px}
  .weak-main{padding:22px}
  .wrow{grid-template-columns:auto minmax(0,1fr);gap:10px 14px}
  .wrow .sev{grid-column:2}
  .wrow .linkbtn{grid-column:2;justify-self:start}
  .top .btn span{display:none}
  .bigscore b{font-size:44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#report" aria-label="شطرنج، صفحه‌ی گزارش">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="#1A2042" stroke="#363E78"/><path d="M10 7h2.6v2.4h2.1V7h2.6v2.4h2.1V7H22v5l-2.4 2.2v6.3H22V24H10v-3.5h2.4v-6.3L10 12z" fill="#B9A6FF"/></svg>
      <b>شطرنج</b>
    </a>
    <nav class="nav" aria-label="بخش‌ها">
      <a href="#report" data-view="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>گزارش</a>
      <a href="#games" data-view="games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 12h18M12 3v18"/></svg>بازی‌ها</a>
      <a href="#train" data-view="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>تمرین</a>
      <a href="#import" data-view="import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>ورود بازی‌ها</a>
    </nav>
    <div class="spacer"></div>
  </div>
</header>

<main id="app" aria-live="polite"></main>

<script type="text/plain" id="samples">[Event "Live Chess"]
[Site "Chess.com"]
[Date "2026.10.12"]
[Round "-"]
[White "Odenwald64"]
[Black "Mannheim_Blitz"]
[Result "1-0"]
[WhiteElo "1475"]
[BlackElo "1436"]
[TimeControl "180+2"]
[ECO "E90"]

  function bestMoves(s, depth) {

  function parsePGN(text) {

    return { h: h, plies: plies, start: h.FEN ? fromFEN(h.FEN) : start() };
  }

    start: start, fromFEN: fromFEN, legal: legal, make: make, san: san, parseSan: parseSan,

<script>
// Turns parsed games into a player report. Material-based heuristics, no engine.
var Analyze = (function () {
  var C = Chess;

  function detectUser(games, name) {
    if (name) {
      var n = name.trim().toLowerCase();
      var hit = games.some(function (g) { return (g.h.White || '').toLowerCase() === n || (g.h.Black || '').toLowerCase() === n; });
      if (hit) return n;
    }
    var cnt = {};
    games.forEach(function (g) {
      [g.h.White, g.h.Black].forEach(function (p) { if (p) { p = p.toLowerCase(); cnt[p] = (cnt[p] || 0) + 1; } });
    });
    var best = null;
    Object.keys(cnt).forEach(function (k) { if (!best || cnt[k] > cnt[best]) best = k; });
    return best;
  }

  function openingName(h) {
    if (h.ECOUrl) {
      var seg = h.ECOUrl.split('/').pop().split('?')[0];
      seg = seg.replace(/-\d.*$/, '').replace(/\.{3}.*$/, '');
      var words = seg.split('-').filter(Boolean);
      var cut = [];
      for (var w of words) { if (/^(with|Accepted|Declined|Variation|Line|Attack|Defense|Opening|Game|System|Gambit)$/i.test(w) && cut.length >= 2) { cut.push(w); break; } cut.push(w); if (cut.length >= 4) break; }
      return cut.join(' ').replace(/Kings/g, "King's").replace(/Queens/g, "Queen's").replace(/Petrovs/g, "Petrov's").replace(/Caro Kann/g, 'Caro-Kann');
    }
    if (h.Opening) return h.Opening.split(':')[0];
    return h.ECO || 'نامشخص';
  }

  function termType(h, res) {
    var t = (h.Termination || '').toLowerCase();
    if (/time|zeit/.test(t)) return 'time';
    if (/checkmate|mate/.test(t)) return 'mate';
    if (/resign/.test(t)) return 'resign';
    if (/abandon/.test(t)) return 'abandon';
    if (res === 'D') return 'draw';
    return 'other';
  }

  function pieceValue(s) {
    var v = 0;
    for (var p of s.b) if (p && !/[PpKk]/.test(p)) v += C.VAL[p.toUpperCase()];
    return v;
  }

  function one(g, user) {
    var h = g.h;
    var meW = (h.White || '').toLowerCase() === user;
    var meB = (h.Black || '').toLowerCase() === user;
    if (!meW && !meB) return null;
    var me = meW ? 'w' : 'b', sign = meW ? 1 : -1;
    var res = h.Result === '1/2-1/2' ? 'D' : h.Result === '1-0' ? (meW ? 'W' : 'L') : h.Result === '0-1' ? (meW ? 'L' : 'W') : null;
    if (!res) return null;
    var tc = (h.TimeControl || '').split('+');
    var base = parseFloat(tc[0]) || null, inc = parseFloat(tc[1]) || 0;
    var p = g.plies, n = p.length;
    var mat = p.map(function (x) { return sign * x.mat; });
    var blunders = [];
    for (var i = 0; i < n; i++) {
      if (p[i].color !== me) continue;
      var before = i > 0 ? mat[i - 1] : 0;
      var after = mat[Math.min(i + 2, n - 1)];
      var persist = mat[Math.min(i + 4, n - 1)];
      if (after - before <= -2 && persist - before <= -2) {
        var pv = pieceValue(p[i].before);
        var phase = i < 20 ? 'opening' : pv <= 26 ? 'endgame' : 'middlegame';
        var prevClk = null;
        for (var j = i - 2; j >= 0; j -= 2) { if (p[j].clk != null) { prevClk = p[j].clk; break; } }
        var spent = (prevClk != null && p[i].clk != null) ? prevClk - p[i].clk + inc : null;
        blunders.push({ ply: i, loss: before - persist, clk: p[i].clk, spent: spent, phase: phase, san: p[i].san });
        i += 3;
      }
    }
    var maxAdv = 0;
    for (var k = 10; k < n - 1; k++) {
      var sustained = Math.min(mat[k], mat[k + 1]);
      if (sustained > maxAdv) maxAdv = sustained;
    }
    var myClocks = p.filter(function (x) { return x.color === me && x.clk != null; }).map(function (x) { return x.clk; });
    var minClk = myClocks.length ? Math.min.apply(null, myClocks) : null;
    var tt = base ? Math.max(15, base * 0.1) : 15;
    var term = termType(h, res);
    var oppName = meW ? h.Black : h.White;
    return {
      id: g._i, g: g, me: me, res: res, term: term, base: base, inc: inc,
      opening: openingName(h), eco: h.ECO || '', date: h.Date || h.UTCDate || '',
      opp: oppName, oppElo: meW ? h.BlackElo : h.WhiteElo, myElo: meW ? h.WhiteElo : h.BlackElo,
      mat: mat, blunders: blunders, maxAdv: maxAdv, minClk: minClk, myClocks: myClocks,
      lostOnTime: res === 'L' && term === 'time',
      ttBlunders: blunders.filter(function (b) { return b.clk != null && b.clk < Math.max(30, tt * 1.5); }).length,
      fastBlunders: blunders.filter(function (b) { return b.spent != null && b.spent < 3; }).length,
      convertFail: res !== 'W' && maxAdv >= 3,
      moves: Math.ceil(n / 2)
    };
  }

  function run(games, name) {
    games.forEach(function (g, i) { g._i = i; });
    var user = detectUser(games, name);
    var list = games.map(function (g) { return one(g, user); }).filter(Boolean);
    list.sort(function (a, b) { return b.date < a.date ? -1 : b.date > a.date ? 1 : b.id - a.id; });
    var tot = { W: 0, D: 0, L: 0 }, col = { w: { W: 0, D: 0, L: 0 }, b: { W: 0, D: 0, L: 0 } };
    list.forEach(function (x) { tot[x.res]++; col[x.me][x.res]++; });
    function score(o) { var n = o.W + o.D + o.L; return n ? (o.W + o.D / 2) / n : 0; }
    var notWon = list.filter(function (x) { return x.res !== 'W'; });
    var losses = list.filter(function (x) { return x.res === 'L'; });

    var ops = {};
    list.forEach(function (x) {
      var k = x.me + '|' + x.opening;
      if (!ops[k]) ops[k] = { name: x.opening, color: x.me, W: 0, D: 0, L: 0, n: 0 };
      ops[k][x.res]++; ops[k].n++;
    });
    var openings = Object.keys(ops).map(function (k) { var o = ops[k]; o.score = score(o); return o; })
      .sort(function (a, b) { return b.n - a.n || a.score - b.score; });

    var phase = { opening: 0, middlegame: 0, endgame: 0 };
    list.forEach(function (x) { x.blunders.forEach(function (b) { phase[b.phase]++; }); });

    var W = [];
    var blunderLoss = losses.filter(function (x) { return x.blunders.length; });
    W.push({
      id: 'blunder', count: blunderLoss.length, of: losses.length,
      title: 'مهره‌ی بی‌دفاع', detail: 'در ' + fa(blunderLoss.length) + ' باخت از ' + fa(losses.length) + ' مهره‌ای را بدون جبران از دست دادی.',
      tip: 'قبل از هر حرکت یک سؤال: بعد از این حرکت، کدام مهره‌ام بی‌دفاع می‌ماند؟',
      filter: function (x) { return x.res === 'L' && x.blunders.length; }
    });
    var timeG = losses.filter(function (x) { return x.lostOnTime || x.ttBlunders; });
    W.push({
      id: 'time', count: timeG.length, of: losses.length,
      title: 'فشار زمان', detail: fa(losses.filter(function (x) { return x.lostOnTime; }).length) + ' باخت روی زمان، و ' + fa(losses.filter(function (x) { return !x.lostOnTime && x.ttBlunders; }).length) + ' باخت دیگر با اشتباهی که در ثانیه‌های آخر زدی.',
      tip: 'در ۱۵ حرکت اول سریع‌تر بازی کن تا برای آخر بازی وقت بماند.',
      filter: function (x) { return x.res === 'L' && (x.lostOnTime || x.ttBlunders); }
    });
    var conv = list.filter(function (x) { return x.convertFail; });
    W.push({
      id: 'convert', count: conv.length, of: notWon.length,
      title: 'تبدیل برتری به برد', detail: 'در ' + fa(conv.length) + ' بازی حداقل ۳ امتیاز مهره جلو بودی و نبردی.',
      tip: 'وقتی جلویی، مهره‌ها را معاوضه کن و از ضدحمله فرار کن؛ عجله لازم نیست.',
      filter: function (x) { return x.convertFail; }
    });
    var weakOp = openings.filter(function (o) { return o.n >= 3; }).sort(function (a, b) { return a.score - b.score; })[0];
    if (weakOp && weakOp.score < 0.45) {
      W.push({
        id: 'opening', count: weakOp.L, of: weakOp.n,
        title: 'گشایش ' + weakOp.name, detail: 'با ' + (weakOp.color === 'w' ? 'سفید' : 'سیاه') + ' در ' + fa(weakOp.n) + ' بازی فقط ' + fa(Math.round(weakOp.score * 100)) + '٪ امتیاز گرفتی.',
        tip: 'ده حرکت اول همین گشایش را مرور کن، یا فعلاً یک گشایش ساده‌تر انتخاب کن.',
        opening: weakOp,
        filter: function (x) { return x.opening === weakOp.name && x.me === weakOp.color; }
      });
    }
    W.forEach(function (w) { w.share = w.of ? w.count / w.of : 0; });
    W.sort(function (a, b) { return b.count - a.count; });

    var train = [];
    list.forEach(function (x) {
      x.blunders.forEach(function (b) {
        if (b.loss >= 2) train.push({ game: x, b: b, pos: x.g.plies[b.ply].before, played: x.g.plies[b.ply] });
      });
    });

    var clockCurve = null;
    var withClk = list.filter(function (x) { return x.myClocks.length > 10 && x.base; });
    if (withClk.length >= 3) {
      var maxM = 40, sumW = [], cW = [], sumL = [], cL = [];
      for (var m = 0; m < maxM; m++) { sumW[m] = 0; cW[m] = 0; sumL[m] = 0; cL[m] = 0; }
      withClk.forEach(function (x) {
        x.myClocks.slice(0, maxM).forEach(function (c, m) {
          var pct = c / x.base;
          if (x.res === 'W') { sumW[m] += pct; cW[m]++; } else if (x.res === 'L') { sumL[m] += pct; cL[m]++; }
        });
      });

        win: sumW.map(function (s, m) { return cW[m] >= 2 ? s / cW[m] : null; }),
        loss: sumL.map(function (s, m) { return cL[m] >= 2 ? s / cL[m] : null; })
      };
    }

    return {
      user: user, games: list, tot: tot, col: col, score: score(tot),
      scoreW: score(col.w), scoreB: score(col.b), openings: openings, phase: phase,
      weaknesses: W, train: train, clockCurve: clockCurve
    };
  }

  function fa(n) { return Number(n).toLocaleString('fa-IR'); }

  return { run: run, fa: fa };
})();

    for (var vr = 0; vr < 8; vr++) {
      for (var vf = 0; vf < 8; vf++) {
        var r = flip ? vr : 7 - vr, f = flip ? 7 - vf : vf, i = r * 8 + f;
        var p = s.b[i], dark = (f + r) % 2 === 0;
        var cls = 'sq' + (dark ? ' d' : '');
        if (o.hl && o.hl.indexOf(i) >= 0) cls += o.bad ? ' bad' : ' hl';
        if (o.sel === i) cls += ' sel';
        if (o.tgts && o.tgts.indexOf(i) >= 0) cls += ' tgt' + (p ? ' cap' : '');
        var inner = '';
        if (p) inner += '<span class="' + (Chess.isW(p) ? 'pw' : 'pb') + '" aria-hidden="true">' + GLYPH[p.toUpperCase()] + '︎</span>';
        if (vr === 7) inner += '<span class="coord f" aria-hidden="true">' + 'abcdefgh'[f] + '</span>';
        if (vf === 0) inner += '<span class="coord r" aria-hidden="true">' + (r + 1) + '</span>';
        var label = Chess.sqName(i) + (p ? ' ' + PNAME[p.toUpperCase()] + ' ' + (Chess.isW(p) ? 'سفید' : 'سیاه') : '');
        if (clickable) html += '<button type="button" class="' + cls + '" data-sq="' + i + '" aria-label="' + label + '">' + inner + '</button>';
        else html += '<div class="' + cls + '">' + inner + '</div>';
      }
    }
    return '<div class="board"' + (clickable ? ' role="grid" aria-label="صفحه‌ی تمرین"' : ' role="img" aria-label="صفحه‌ی شطرنج"') + '>' + html + '</div>';
  }

  // ---------- views ----------

    h += '<div class="meter"><div class="track"><div class="fill" style="width:' + Math.round(top.share * 100) + '%"></div></div><span>' + fa(top.count) + ' از ' + fa(top.of) + (top.id === 'opening' ? ' بازی' : top.id === 'convert' ? ' بازیِ نبرده' : ' باخت') + '</span></div>';

    h += '<div class="rings">';
    h += '<div class="ring"><div class="rv">' + ringSVG(R.scoreW, scoreCol(R.scoreW)) + '<div class="in"><small>با سفید</small><b>' + pct(R.scoreW) + '</b></div></div><span class="cap">' + fa(nWh) + ' بازی</span></div>';

    h += '</div>';
    h += '<div class="legend" style="justify-content:center"><span><i class="dot" style="background:var(--win)"></i>' + fa(t.W) + ' برد</span><span><i class="dot" style="background:var(--draw)"></i>' + fa(t.D) + ' مساوی</span><span><i class="dot" style="background:var(--loss)"></i>' + fa(t.L) + ' باخت</span></div>';
    h += '<div class="kv">';
    if (last && last.myElo) h += '<div><span>ریتینگ آخرین بازی</span><span class="mono">' + esc(last.myElo) + '</span></div>';
    h += '<div><span>بازی‌های بررسی‌شده</span><span>' + fa(n) + '</span></div></div></aside></section>';

    if (w.length > 1) {
      h += '<section><div class="sec-h"><h2>الگوهای دیگر</h2><p>به ترتیب تعداد بازی‌هایی که درگیرشان بود</p></div><div class="card wlist" style="padding-top:18px;padding-bottom:4px">';
      w.slice(1).forEach(function (x) {
        h += '<div class="wrow">' + wtile(x.id, true) + '<div><h3>' + esc(x.title) + '</h3><p>' + esc(x.detail) + '</p></div>';
        h += '<div class="sev"><div class="track"><div class="fill" style="width:' + Math.round(x.share * 100) + '%"></div></div><span>' + fa(x.count) + ' از ' + fa(x.of) + '</span></div>';
        h += '<button type="button" class="linkbtn" data-weak="' + x.id + '">بازی‌ها</button></div>';
      });

    }

    h += '<section class="grid2">';

    R.openings.slice(0, 8).forEach(function (o) {

    });

    h += '<div class="card"><div class="sec-h"><h2>مدیریت زمان</h2><p>درصد وقت باقی‌مانده در هر حرکت</p></div>';
    h += R.clockCurve ? clockChart(R.clockCurve) : '<p class="fine">فایل این بازی‌ها زمان حرکت‌ها را ندارد.</p>';
    var ph = R.phase, totB = ph.opening + ph.middlegame + ph.endgame;
    h += '<div class="phases">';

    });

    return h;
  }

  function clockChart(cc) {
    var W = 600, H = 230, L = 40, Rr = 12, T = 14, B = 30, n = 40;
    function x(m) { return L + (W - L - Rr) * m / (n - 1); }
    function y(v) { return T + (H - T - B) * (1 - v); }
    function path(arr) {
      var d = '', on = false;
      arr.forEach(function (v, m) { if (v == null) { on = false; return; } d += (on ? 'L' : 'M') + x(m).toFixed(1) + ' ' + y(v).toFixed(1); on = true; });
      return d;
    }
    function lastPt(arr, col) {
      for (var m = arr.length - 1; m >= 0; m--) if (arr[m] != null) return '<circle cx="' + x(m).toFixed(1) + '" cy="' + y(arr[m]).toFixed(1) + '" r="4" fill="' + col + '"/>';
      return '';
    }
    var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" dir="ltr" role="img" aria-label="نمودار زمان باقی‌مانده در بردها و باخت‌ها">';
    [0, 0.5, 1].forEach(function (v) {
      s += '<line x1="' + L + '" x2="' + (W - Rr) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#26344F"/>';
      s += '<text x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + fa(v * 100) + '٪</text>';
    });
    [1, 10, 20, 30, 40].forEach(function (m) {
      s += '<text x="' + x(m - 1) + '" y="' + (H - 8) + '" text-anchor="middle">' + fa(m) + '</text>';
    });
    s += '<path d="' + path(cc.win) + '" fill="none" stroke="#4CD4A8" stroke-width="2.2" stroke-linejoin="round"/>';
    s += '<path d="' + path(cc.loss) + '" fill="none" stroke="#F05A6E" stroke-width="2.2" stroke-linejoin="round"/>';
    s += lastPt(cc.win, '#4CD4A8') + lastPt(cc.loss, '#F05A6E');
    s += '</svg>';
    s += '<div class="legend" style="margin-top:8px"><span><i class="dot" style="background:var(--win)"></i>بردها</span><span><i class="dot" style="background:var(--loss)"></i>باخت‌ها</span><span>محور افقی: شماره‌ی حرکت</span></div>';
    return s;
  }

  function filteredGames() {
    var R = S.rep, list = R.games;
    if (S.weakFilter) {
      var w = R.weaknesses.filter(function (x) { return x.id === S.weakFilter; })[0];
      if (w) return list.filter(w.filter);
    }
    if (S.filter === 'L') return list.filter(function (x) { return x.res === 'L'; });
    if (S.filter === 'W') return list.filter(function (x) { return x.res === 'W'; });
    if (S.filter === 'blun') return list.filter(function (x) { return x.blunders.length; });
    return list;
  }

  function viewGames() {
    var R = S.rep, list = filteredGames();
    if (S.gid == null || !list.some(function (x) { return x.id === S.gid; })) { S.gid = list.length ? list[0].id : null; S.ply = -2; }
    var h = '<div class="gwrap"><section aria-label="فهرست بازی‌ها"><div class="filters">';

      var w = R.weaknesses.filter(function (x) { return x.id === S.weakFilter; })[0];

    });

      h += '<span class="who"><b dir="auto">' + esc(x.opp) + (x.oppElo ? ' <span class="mono" style="color:var(--muted);font-size:12px">' + esc(x.oppElo) + '</span>' : '') + '</b><small>' + faDate(x.date) + ' | با ' + (x.me === 'w' ? 'سفید' : 'سیاه') + ' | <span dir="ltr">' + esc(x.opening) + '</span></small></span>';

  function viewer() {

    if (S.ply === -2) S.ply = x.blunders.length ? x.blunders[0].ply : plies.length - 1;

      h += '<button type="button" class="linkbtn" style="align-self:flex-start" data-trainfrom="' + x.id + ':' + bl.ply + '">همین موقعیت را تمرین کن</button></div>';
    } else if (x.blunders.length) {
      h += '<div class="note"><b>' + fa(x.blunders.length) + ' اشتباه در این بازی</b><span>حرکت‌های قرمز را در فهرست ببین.</span></div>';
    } else {

    }
    h += '<div class="moves" id="moves">';
    for (var i = 0; i < plies.length; i += 2) {

        var isB = x.blunders.some(function (b) { return b.ply === j; });
        h += '<button type="button" data-ply="' + j + '" class="' + (j === cur ? 'cur ' : '') + (isB ? 'blun' : '') + '">' + esc(plies[j].san) + '</button>';
      }
      h += '</div>';
    }
    h += '</div></div></div>';

  function matChart(x, cur) {
    var W = 600, H = 90, n = x.mat.length, mx = 5;
    x.mat.forEach(function (v) { mx = Math.max(mx, Math.abs(v)); });
    function px(i) { return n > 1 ? i / (n - 1) * W : 0; }
    function py(v) { return H / 2 - v / mx * (H / 2 - 6); }
    var d = 'M0 ' + py(0);
    x.mat.forEach(function (v, i) { d += 'L' + px(i).toFixed(1) + ' ' + py(v).toFixed(1); });
    var area = d + 'L' + W + ' ' + py(0) + 'Z';
    var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" style="height:70px" role="img" aria-label="نمودار تعادل مهره‌ها در طول بازی">';
    s += '<defs><clipPath id="up"><rect x="0" y="0" width="' + W + '" height="' + py(0) + '"/></clipPath><clipPath id="dn"><rect x="0" y="' + py(0) + '" width="' + W + '" height="' + H + '"/></clipPath></defs>';
    s += '<rect x="0" y="0" width="' + W + '" height="' + H + '" rx="8" fill="#1C2A42"/>';
    s += '<path d="' + area + '" fill="rgba(76,212,168,.25)" clip-path="url(#up)"/><path d="' + area + '" fill="rgba(240,90,110,.25)" clip-path="url(#dn)"/>';
    s += '<line x1="0" x2="' + W + '" y1="' + py(0) + '" y2="' + py(0) + '" stroke="#34456A" stroke-dasharray="3 4"/>';
    x.blunders.forEach(function (b) { s += '<circle cx="' + px(b.ply).toFixed(1) + '" cy="' + py(x.mat[b.ply]).toFixed(1) + '" r="3.5" fill="#F05A6E"/>'; });
    if (cur >= 0) s += '<line x1="' + px(cur).toFixed(1) + '" x2="' + px(cur).toFixed(1) + '" y1="0" y2="' + H + '" stroke="#B9A6FF" stroke-width="2"/>';
    s += '</svg>';
    return s;
  }

  function trainItems() { return S.rep.train; }

  function viewTrain() {
    var items = trainItems();
    if (!items.length) return banner() + '<div class="card empty">در این بازی‌ها اشتباه مهره‌ای پیدا نشد که تمرین بسازد.</div>';
    if (S.ti >= items.length) S.ti = 0;
    var it = items[S.ti], pos = S.tdone && S.tdone.after ? S.tdone.after : it.pos;
    var me = it.game.me;
    var tg = [];
    if (S.tsel != null && !S.tdone) tg = Chess.legal(it.pos).filter(function (m) { return m.from === S.tsel; }).map(function (m) { return m.to; });
    var hl = S.tdone && S.tdone.m ? [S.tdone.m.from, S.tdone.m.to] : (S.tfb && S.tfb.m ? [S.tfb.m.from, S.tfb.m.to] : []);
    var h = banner() + '<div class="twrap"><div>' + boardHTML(pos, { flip: me === 'b', click: !S.tdone, sel: S.tsel, tgts: tg, hl: hl, bad: S.tfb && S.tfb.kind === 'no' }) + '</div>';
    h += '<div class="tpanel"><div class="tprog"><span>موقعیت ' + fa(S.ti + 1) + ' از ' + fa(items.length) + '</span><div class="track"><div class="fill" style="width:' + ((S.ti + 1) / items.length * 100) + '%"></div></div></div>';
    h += '<p class="eyebrow">از بازی خودت در برابر <bdi>' + esc(it.game.opp) + '</bdi> · ' + faDate(it.game.date) + ' · ' + PHASE[it.b.phase] + '</p>';

    h += '<p style="color:#C4CCDC">در بازی اصلی <span class="mono">' + esc(it.played.san) + '</span> زدی و ' + fa(it.b.loss) + ' امتیاز مهره از دست رفت. مهره‌ای را انتخاب کن و حرکتش بده.</p>';
    var fb = S.tfb;

    else h += '<div class="fb" role="status"><span style="color:var(--muted)">روی یک مهره‌ی ' + (me === 'w' ? 'سفید' : 'سیاه') + ' بزن.</span></div>';
    h += '<div class="actions"><button type="button" class="btn" data-t="prev"' + (S.ti === 0 ? ' disabled' : '') + '>قبلی</button><button type="button" class="btn" data-t="reveal">نمایش جواب</button><button type="button" class="btn primary" data-t="next">موقعیت بعدی</button></div>';
    h += '<p class="fine">بررسی حرکت با محاسبه‌ی مهره‌ها تا سه نیم‌حرکت انجام می‌شود، هنوز با موتور کامل نه. حرکت‌هایی که مهره را حفظ می‌کنند درست حساب می‌شوند.</p></div></div>';
    return h;
  }

  function viewImport() {
    var u = S.user || '';
    var d = new Date(), y = d.getFullYear(), m = d.getMonth() + 1;
    var pm = m === 1 ? 12 : m - 1, py = m === 1 ? y - 1 : y;
    function two(n) { return n < 10 ? '0' + n : '' + n; }
    var h = '<section class="import"><div class="card"><h2>۱. فایل بازی‌هایت را بگیر</h2><p class="fine">شطرنج خودش به Chess.com وصل نمی‌شود؛ فایل PGN را از آن‌جا می‌گیری و این‌جا می‌گذاری.</p>';
    h += '<div class="field" style="margin-top:16px"><label for="uname">نام کاربری تو</label><input id="uname" dir="ltr" autocomplete="off" spellcheck="false" placeholder="Chess.com یا Lichess" value="' + esc(u) + '"></div>';
    h += '<div class="actions" style="margin-top:14px"><button type="button" class="btn primary" id="auto-cc">دریافت خودکار از Chess.com</button><button type="button" class="btn" id="auto-li">از Lichess</button></div>';
    h += '<p class="fine" id="auto-msg" role="status" style="margin-top:8px"></p>';
    h += '<p class="fine" style="margin-top:14px">اگر دریافت خودکار این‌جا کار نکرد، دستی:</p>';
    h += '<ol class="steps"><li><span>یکی از لینک‌های زیر را باز کن. مرورگر فایل را دانلود می‌کند.</span></li><li><span>فایل را در کادر کناری رها کن یا انتخابش کن.</span></li><li><span>گزارش با بازی‌های خودت ساخته می‌شود و در همین مرورگر می‌ماند.</span></li></ol>';
    h += '<div class="dl" id="dl">' + dlLinks(u, y, m, py, pm, two) + '</div></div>';
    h += '<div class="card" style="display:flex;flex-direction:column;gap:16px"><h2>۲. بازی‌ها را این‌جا بگذار</h2>';
    h += '<label class="drop" id="drop" for="file">' + ICON.upload + '<span><b style="color:var(--text)">فایل PGN را این‌جا رها کن</b><br>یا بزن تا انتخابش کنی</span><input id="file" type="file" accept=".pgn,.txt,application/x-chess-pgn,text/plain" multiple class="sr"></label>';
    h += '<div class="field"><label for="paste">یا متن PGN را بچسبان</label><textarea id="paste" placeholder="[Event &quot;Live Chess&quot;] ..."></textarea></div>';
    h += '<div class="actions"><button type="button" class="btn primary" id="go">تحلیل کن</button>' + (S.sample ? '' : '<button type="button" class="btn ghost" id="reset">برگشت به نمونه</button>') + '</div>';
    if (S.importMsg) h += '<p class="' + (S.importMsg.err ? 'err' : 'ok-msg') + '" role="status">' + esc(S.importMsg.text) + '</p>';
    h += '</div></section>';
    return h;
  }

  function dlLinks(u, y, m, py, pm, two) {
    if (!u) return '<p class="fine">نام کاربری‌ات را بنویس تا لینک‌ها ساخته شوند.</p>';
    var e = encodeURIComponent(u.trim());
    return '<a href="https://api.chess.com/pub/player/' + e.toLowerCase() + '/games/' + y + '/' + two(m) + '/pgn" target="_blank" rel="noopener">Chess.com: بازی‌های این ماه</a>' +
      '<a href="https://api.chess.com/pub/player/' + e.toLowerCase() + '/games/' + py + '/' + two(pm) + '/pgn" target="_blank" rel="noopener">Chess.com: بازی‌های ماه قبل</a>' +
      '<a href="https://lichess.org/api/games/user/' + e + '?max=100&amp;clocks=true&amp;opening=true" target="_blank" rel="noopener">Lichess: ۱۰۰ بازی آخر</a>';
  }

  // ---------- render ----------
  function render() {
    var v = S.view;
    document.querySelectorAll('.nav a').forEach(function (a) { if (a.dataset.view === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    var html = v === 'games' ? viewGames() : v === 'train' ? viewTrain() : v === 'import' ? viewImport() : viewReport();
    app.innerHTML = html;
    if (v === 'games') {
      var c = app.querySelector('.mrow button.cur'), box = document.getElementById('moves');
      if (c && box) box.scrollTop = c.offsetTop - box.clientHeight / 2;
    }
    if (v === 'import') bindImport();
  }

  function route() {
    var hsh = (location.hash || '').replace('#', '');
    S.view = ['report', 'games', 'train', 'import'].indexOf(hsh) >= 0 ? hsh : 'report';
    render();
    window.scrollTo(0, 0);
  }

  // ---------- events ----------
  app.addEventListener('click', function (e) {
    var t = e.target.closest('button, [data-weak]');
    if (!t) return;
    if (t.dataset.weak) { S.weakFilter = t.dataset.weak; S.gid = null; go('games'); return; }
    if (t.dataset.clearweak) { S.weakFilter = null; S.filter = 'all'; render(); return; }
    if (t.dataset.filter) { S.weakFilter = null; S.filter = t.dataset.filter; render(); return; }
    if (t.dataset.gid) { S.gid = +t.dataset.gid; S.ply = -2; render(); return; }
    if (t.dataset.ply) { S.ply = +t.dataset.ply; render(); focusBoard(); return; }
    if (t.dataset.nav) { navPly(t.dataset.nav); return; }
    if (t.dataset.trainfrom) {
      var pp = t.dataset.trainfrom.split(':');
      var idx = S.rep.train.findIndex(function (it) { return it.game.id === +pp[0] && it.b.ply === +pp[1]; });
      if (idx >= 0) { S.ti = idx; resetTrain(); }
      go('train'); return;
    }
    if (t.dataset.t) { trainAction(t.dataset.t); return; }
    if (t.dataset.sq) { trainClick(+t.dataset.sq); return; }
  });

  function go(v) { if (location.hash === '#' + v) route(); else location.hash = v; }
  function focusBoard() { var b = document.getElementById('vboard'); if (b) b.focus({ preventScroll: true }); }

  function navPly(k) {
    var x = S.rep.games.filter(function (g) { return g.id === S.gid; })[0];
    if (!x) return;
    var n = x.g.plies.length;
    if (k === 'first') S.ply = -1;
    else if (k === 'prev') S.ply = Math.max(-1, S.ply - 1);
    else if (k === 'next') S.ply = Math.min(n - 1, S.ply + 1);
    else if (k === 'last') S.ply = n - 1;
    render(); focusBoard();
  }

  app.addEventListener('keydown', function (e) {
    if (!e.target.closest || !e.target.closest('#vboard')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); navPly('next'); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); navPly('prev'); }
    else if (e.key === 'Home') { e.preventDefault(); navPly('first'); }
    else if (e.key === 'End') { e.preventDefault(); navPly('last'); }
  });

  function resetTrain() { S.tsel = null; S.tfb = null; S.tdone = false; }

  function bestFor(i) {
    if (!S.tcache[i]) S.tcache[i] = Chess.bestMoves(S.rep.train[i].pos, 3);
    return S.tcache[i];
  }

  function trainAction(a) {
    var n = S.rep.train.length;
    if (a === 'next') { S.ti = (S.ti + 1) % n; resetTrain(); render(); return; }
    if (a === 'prev') { S.ti = Math.max(0, S.ti - 1); resetTrain(); render(); return; }
    if (a === 'reveal') {
      S.tfb = { kind: 'think', text: 'در حال محاسبه…' }; render();
      setTimeout(function () {
        var it = S.rep.train[S.ti], sc = bestFor(S.ti), b = sc[0];
        var sanStr = Chess.san(it.pos, b.m);
        S.tdone = { m: b.m, after: Chess.make(it.pos, b.m) };
        S.tfb = { kind: 'ok', text: 'یک حرکت امن این‌جا <span class="mono">' + esc(sanStr) + '</span> بود. ' + gainText(sc, it) };
        render();
      }, 30);
    }
  }

  function gainText(sc, it) {
    var playedV = null;
    sc.forEach(function (x) { if (x.m.from === it.played.from && x.m.to === it.played.to) playedV = x.v; });
    if (playedV == null) return '';
    var diff = sc[0].v - playedV;
    return diff > 0 ? 'این حرکت ' + fa(diff) + ' امتیاز مهره بهتر از حرکت بازی است.' : '';
  }

  function trainClick(sq) {
    var it = S.rep.train[S.ti], pos = it.pos, me = it.game.me;
    var p = pos.b[sq];
    if (S.tsel == null || (p && Chess.isW(p) === (me === 'w'))) {
      if (p && Chess.isW(p) === (me === 'w')) { S.tsel = sq; S.tfb = null; render(); }
      return;
    }
    var mv = Chess.legal(pos).filter(function (m) { return m.from === S.tsel && m.to === sq && (!m.promo || m.promo.toUpperCase() === 'Q'); })[0];
    if (!mv) { S.tsel = null; render(); return; }
    S.tsel = null;
    S.tfb = { kind: 'think', text: 'در حال بررسی حرکت تو…', m: mv }; render();
    setTimeout(function () {
      var sc = bestFor(S.ti), best = sc[0].v, mine = null, playedV = null;
      sc.forEach(function (x) {
        if (x.m.from === mv.from && x.m.to === mv.to && (x.m.promo || '') === (mv.promo || '')) mine = x.v;
        if (x.m.from === it.played.from && x.m.to === it.played.to) playedV = x.v;
      });
      var sanStr = Chess.san(pos, mv);
      if (mine >= best) {
        S.tdone = { m: mv, after: Chess.make(pos, mv) };
        S.tfb = { kind: 'ok', text: '<b>درست.</b> با <span class="mono">' + esc(sanStr) + '</span> مهره‌ای از دست نمی‌رود.' };
      } else if (playedV != null && mine > playedV) {
        S.tfb = { kind: 'no', m: mv, text: '<span class="mono">' + esc(sanStr) + '</span> بهتر از حرکت بازی است، ولی هنوز ' + fa(best - mine) + ' امتیاز مهره از دست می‌رود. دوباره امتحان کن.' };
      } else {
        S.tfb = { kind: 'no', m: mv, text: 'با <span class="mono">' + esc(sanStr) + '</span> هم ' + fa(Math.max(1, best - mine)) + ' امتیاز مهره از دست می‌رود. دوباره امتحان کن.' };
      }
      render();
    }, 30);
  }

  // ---------- import ----------
  function bindImport() {
    var un = document.getElementById('uname'), dl = document.getElementById('dl');
    var d = new Date(), y = d.getFullYear(), m = d.getMonth() + 1;
    var pm = m === 1 ? 12 : m - 1, py = m === 1 ? y - 1 : y;
    function two(n) { return n < 10 ? '0' + n : '' + n; }
    un.addEventListener('input', function () { S.user = un.value; dl.innerHTML = dlLinks(un.value, y, m, py, pm, two); });
    document.getElementById('auto-cc').addEventListener('click', function () { autoFetch('cc'); });
    document.getElementById('auto-li').addEventListener('click', function () { autoFetch('li'); });
    var drop = document.getElementById('drop'), file = document.getElementById('file');
    ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
    drop.addEventListener('drop', function (e) { readFiles(e.dataTransfer.files); });
    file.addEventListener('change', function () { readFiles(file.files); });
    document.getElementById('go').addEventListener('click', function () {
      var txt = document.getElementById('paste').value;
      if (!txt.trim()) { S.importMsg = { err: true, text: 'اول یک فایل بگذار یا متن PGN را بچسبان.' }; render(); return; }
      finish(txt);
    });
    var rs = document.getElementById('reset');
    if (rs) rs.addEventListener('click', function () { forget('shatranj.pgn'); forget('shatranj.user'); load(SAMPLES, 'Mannheim_Blitz', true); S.importMsg = null; go('report'); });
  }


  function autoFetch(src) {
    var u = (S.user || '').trim(), msg = document.getElementById('auto-msg');
    function say(t, err) { if (msg) { msg.textContent = t; msg.className = err ? 'err' : 'fine'; } }
    if (!u) { say('اول نام کاربری‌ات را بنویس.', true); return; }
    say('در حال دریافت بازی‌ها…');
    var job;
    if (src === 'cc') {
      var base = 'https://api.chess.com/pub/player/' + encodeURIComponent(u.toLowerCase());
      job = fetch(base + '/games/archives').then(function (r) {
        if (r.status === 404) throw new Error('nouser');
        if (!r.ok) throw new Error('http');
        return r.json();
      }).then(function (j) {
        var arcs = (j.archives || []).slice(-2);
        if (!arcs.length) throw new Error('nogames');
        return Promise.all(arcs.map(function (a) { return fetch(a + '/pgn').then(function (r) { return r.ok ? r.text() : ''; }); }));
      }).then(function (parts) { return parts.join('\n\n'); });
    } else {
      job = fetch('https://lichess.org/api/games/user/' + encodeURIComponent(u) + '?max=100&clocks=true&opening=true', { headers: { Accept: 'application/x-chess-pgn' } })
        .then(function (r) { if (r.status === 404) throw new Error('nouser'); if (!r.ok) throw new Error('http'); return r.text(); });
    }
    job.then(function (txt) {
      if (!txt || !txt.trim()) throw new Error('nogames');
      say('بازی‌ها رسید. در حال تحلیل…');
      finish(txt);
    }).catch(function (e) {
      if (e.message === 'nouser') say('کاربری با این نام پیدا نشد.', true);
      else if (e.message === 'nogames') say('برای این کاربر بازی‌ای در دو ماه اخیر پیدا نشد.', true);
      else say('این نسخه‌ی داخل Claude اجازه‌ی وصل شدن به سایت‌های دیگر را ندارد. نسخه‌ی مستقل سایت را باز کن، یا از لینک‌های دستی زیر استفاده کن.', true);
    });
  }

  function readFiles(files) {
    if (!files || !files.length) return;
    var parts = [], left = files.length;
    Array.prototype.forEach.call(files, function (f) {
      var r = new FileReader();
      r.onload = function () { parts.push(String(r.result)); if (--left === 0) finish(parts.join('\n\n')); };
      r.onerror = function () { if (--left === 0) finish(parts.join('\n\n')); };
      r.readAsText(f);
    });
  }

  function finish(txt) {
    S.importMsg = { err: false, text: 'در حال خواندن بازی‌ها…' }; render();
    setTimeout(function () {
      var u = (S.user || '').trim();
      var r = load(txt, u, false);
      if (r.error) { S.importMsg = { err: true, text: r.error }; render(); return; }
      store('shatranj.pgn', txt); store('shatranj.user', u);
      S.importMsg = null;
      go('report');
    }, 20);
  }

  // ---------- boot ----------
  var SAMPLES = document.getElementById('samples').textContent;
  var saved = recall('shatranj.pgn');
  S.user = recall('shatranj.user') || '';
  if (!(saved && load(saved, S.user, false).ok)) load(SAMPLES, 'Mannheim_Blitz', true);
  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
